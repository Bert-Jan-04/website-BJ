backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/assets/images"
public_folder: "/assets/images"

locale: "nl"

collections:
  - name: "pages"
    label: "Pagina's"
    files:

      - file: "src/data/site.json"
        label: "Bedrijfsgegevens"
        name: "site"
        description: "Gebruikt in de header, footer en contactsecties op alle pagina's."
        fields:
          - { label: "Bedrijfsnaam", name: "companyName", widget: "string" }
          - { label: "KVK-nummer", name: "kvk", widget: "string" }
          - { label: "Adres", name: "address", widget: "string" }
          - { label: "Telefoonnummer (weergave)", name: "phone", widget: "string" }
          - { label: "WhatsApp-nummer (alleen cijfers, met landcode, bv. 31612345678)", name: "whatsapp", widget: "string", pattern: ["^[0-9]+$", "Alleen cijfers, geen + of spaties"] }
          - { label: "E-mailadres", name: "email", widget: "string" }
          - { label: "Instagram-naam (met @)", name: "instagramHandle", widget: "string" }
          - { label: "Instagram-URL", name: "instagramUrl", widget: "string" }

      - file: "src/data/home.json"
        label: "Homepage"
        name: "home"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Titel regel 1", name: "titleLine1", widget: "string" }
              - { label: "Titel regel 2", name: "titleLine2", widget: "string" }
              - { label: "Titel regel 3", name: "titleLine3", widget: "string" }
              - { label: "Subtitel", name: "subtitle", widget: "text" }
              - { label: "Knoptekst", name: "ctaLabel", widget: "string" }
              - { label: "Link 'wie is dit' tekst", name: "whoLinkLabel", widget: "string" }
          - label: "Logo's (bedrijven die ik help)"
            name: "logos"
            widget: "list"
            fields:
              - { label: "Naam", name: "name", widget: "string" }
              - { label: "Logo", name: "image", widget: "image" }
          - label: "Foto-cirkel (5, vast)"
            name: "arcCards"
            widget: "list"
            min: 5
            max: 5
            fields:
              - { label: "Afbeelding", name: "image", widget: "image" }
              - { label: "Alt-tekst", name: "alt", widget: "string" }
              - { label: "Label tonen (alleen eerste kaart)", name: "mark", widget: "boolean", required: false, default: false }
          - { label: "Over mij (teaser)", name: "aboutTeaser", widget: "text" }
          - label: "Statistieken (3, vast)"
            name: "stats"
            widget: "list"
            min: 3
            max: 3
            fields:
              - { label: "Waarde", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Playground (projecten uitgelicht)"
            name: "playground"
            widget: "object"
            fields:
              - label: "Tegels"
                name: "tiles"
                widget: "list"
                fields:
                  - { label: "Afbeelding", name: "image", widget: "image" }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }
          - label: "Shorts / social sectie"
            name: "shorts"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Subtitel", name: "subtitle", widget: "text" }
              - { label: "Statistiek-tekst", name: "stat", widget: "string" }
          - label: "Afsluitende sectie"
            name: "final"
            widget: "object"
            fields:
              - { label: "Titel regel 1", name: "titleLine1", widget: "string" }
              - { label: "Titel regel 2", name: "titleLine2", widget: "string" }
              - { label: "Titel regel 3", name: "titleLine3", widget: "string" }
              - { label: "Subtitel", name: "subtitle", widget: "text" }
              - { label: "Notitie onder knop", name: "note", widget: "string" }

      - file: "src/data/diensten.json"
        label: "Diensten-pagina"
        name: "diensten"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Subtitel", name: "subtitle", widget: "text" }
              - label: "Chips (snelkoppelingen)"
                name: "chips"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Anker (bv. #seo)", name: "href", widget: "string" }
          - label: "Design & Marketing sectie"
            name: "designMarketing"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Introtekst", name: "intro", widget: "text" }
              - label: "Kaarten (2, vast)"
                name: "cards"
                widget: "list"
                min: 2
                max: 2
                fields: &serviceCardFields
                  - { label: "Anker-ID (niet wijzigen)", name: "anchorId", widget: "string" }
                  - { label: "Tag boven titel", name: "tag", widget: "string" }
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Beschrijving", name: "desc", widget: "text" }
                  - { label: "Ideaal voor (tags)", name: "idealFor", widget: "list", required: false }
                  - label: "Tools/kanalen groep 1"
                    name: "group1"
                    widget: "object"
                    required: false
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Items", name: "items", widget: "list" }
                  - label: "Tools/kanalen groep 2"
                    name: "group2"
                    widget: "object"
                    required: false
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Items", name: "items", widget: "list" }
                  - label: "Formaat-chips (alleen social media)"
                    name: "formatChips"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Ratio", name: "ratio", widget: "string" }
                      - { label: "Label", name: "label", widget: "string" }
                  - label: "Statistieken (alleen SEO)"
                    name: "stats"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Waarde", name: "value", widget: "string" }
                      - { label: "Label", name: "label", widget: "string" }
                  - { label: "Kaart: wat is inbegrepen", name: "features", widget: "list" }
                  - { label: "Notitie onder knop", name: "microCopy", widget: "string", required: false }
                  - label: "Extra opties"
                    name: "addons"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Prijs", name: "price", widget: "string" }
          - label: "SEO-dienst"
            name: "seo"
            widget: "object"
            fields: *serviceCardFields
          - label: "Marketing-dienst"
            name: "marketing"
            widget: "object"
            fields: *serviceCardFields
          - label: "Procesautomatisering sectie"
            name: "automatisering"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Introtekst", name: "intro", widget: "text" }
              - label: "Kaarten (2, vast)"
                name: "cards"
                widget: "list"
                min: 2
                max: 2
                fields: *serviceCardFields
          - label: "Werkwijze"
            name: "werkwijze"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Subtitel", name: "subtitle", widget: "text" }
              - label: "Stappen (4, vast)"
                name: "steps"
                widget: "list"
                min: 4
                max: 4
                fields:
                  - { label: "Stap-label", name: "tag", widget: "string" }
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Beschrijving", name: "desc", widget: "text" }
                  - { label: "Details", name: "items", widget: "list" }
                  - { label: "Duur", name: "duration", widget: "string" }
          - label: "CTA-banner"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Subtitel", name: "subtitle", widget: "string" }
              - { label: "Knoptekst", name: "buttonLabel", widget: "string" }

      - file: "src/data/cases.json"
        label: "Klantcases-pagina"
        name: "cases"
        fields:
          - label: "Page hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Subtitel", name: "subtitle", widget: "text" }
          - label: "Cases"
            name: "cases"
            widget: "list"
            fields:
              - { label: "ID (uniek, geen spaties)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "Alleen kleine letters, cijfers en koppeltekens"] }
              - { label: "Logo", name: "logo", widget: "image" }
              - { label: "Logo-hoogte (bv. 28px)", name: "logoHeight", widget: "string" }
              - { label: "Logo grijstinten weergeven", name: "grayscaleLogo", widget: "boolean" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschrijving", name: "description", widget: "text" }
              - { label: "Tags", name: "tags", widget: "list" }
              - { label: "Bestandsprefix schermafbeeldingen (bv. 'sportpoeder')", name: "armPrefix", widget: "string" }
              - label: "Schermafbeeldingen (device-mockup slideshow)"
                name: "slides"
                widget: "list"
                fields:
                  - { label: "Afbeelding", name: "src", widget: "image" }
                  - { label: "Alt-tekst", name: "alt", widget: "string" }
          - label: "CTA-banner"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Subtitel", name: "subtitle", widget: "string" }
              - { label: "Knoptekst", name: "buttonLabel", widget: "string" }

      - file: "src/data/over-mij.json"
        label: "Over mij-pagina"
        name: "over-mij"
        fields:
          - { label: "Marquee-titel (bovenaan, scrollende tekst)", name: "marqueeTitle", widget: "string" }
          - label: "Videoreel"
            name: "reel"
            widget: "list"
            fields:
              - { label: "Type", name: "type", widget: "select", options: ["video", "image"] }
              - { label: "Bestand (video of afbeelding)", name: "src", widget: "file" }
              - { label: "Poster-afbeelding (alleen video)", name: "poster", widget: "image", required: false }
              - { label: "Alt-tekst (alleen afbeelding)", name: "alt", widget: "string", required: false }
          - label: "Intro"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Grote foto", name: "photo", widget: "image" }
              - { label: "Tekst", name: "text", widget: "text" }
              - { label: "Tags", name: "tags", widget: "list" }
              - { label: "Badge-foto", name: "badgePhoto", widget: "image" }
              - { label: "Badge-label", name: "badgeLabel", widget: "string" }
              - label: "Badge-statistiek"
                name: "badgeStat"
                widget: "object"
                fields:
                  - { label: "Waarde", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
          - label: "Mijn verhaal"
            name: "story"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Paragrafen", name: "paragraphs", widget: "list" }
          - label: "Bedrijven die zijn geholpen"
            name: "clients"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - label: "Logo's"
                name: "logos"
                widget: "list"
                fields:
                  - { label: "Logo", name: "src", widget: "image" }
                  - { label: "Alt-tekst", name: "alt", widget: "string" }
                  - { label: "Hoogte (bv. 28px)", name: "height", widget: "string" }
          - label: "Kernwaarden (4, vast)"
            name: "kern"
            widget: "list"
            min: 4
            max: 4
            fields:
              - { label: "Volgnummer (bv. 01)", name: "id", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titel (dun)", name: "titleThin", widget: "string" }
              - { label: "Titel (vet)", name: "titleBold", widget: "string" }
              - { label: "Tekst", name: "text", widget: "text" }
              - { label: "Tags", name: "tags", widget: "list", required: false }
              - { label: "Afbeelding", name: "image", widget: "image" }
              - { label: "Kleurvariant", name: "variant", widget: "select", options: ["dark", "stone", "paper", "mist"] }
              - { label: "Label op afbeelding (optioneel)", name: "imageTag", widget: "string", required: false }
          - label: "Waarom sportbedrijven voor mij kiezen"
            name: "manifesto"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Introtekst", name: "intro", widget: "text" }
              - label: "Redenen (3, vast)"
                name: "reasons"
                widget: "list"
                min: 3
                max: 3
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Tekst", name: "text", widget: "string" }
              - { label: "Knoptekst", name: "buttonLabel", widget: "string" }
              - label: "Statistieken (4, vast)"
                name: "stats"
                widget: "list"
                min: 4
                max: 4
                fields:
                  - { label: "Waarde", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
          - label: "Afsluitende sectie"
            name: "closing"
            widget: "object"
            fields:
              - { label: "Titel regel 1", name: "titleLine1", widget: "string" }
              - { label: "Titel regel 2", name: "titleLine2", widget: "string" }
              - label: "Afbeeldingen (3, vast)"
                name: "images"
                widget: "list"
                min: 3
                max: 3
                fields:
                  - { label: "Afbeelding", name: "src", widget: "image" }
                  - { label: "Alt-tekst", name: "alt", widget: "string" }
                  - { label: "Label op afbeelding (optioneel)", name: "tag", widget: "string", required: false }

      - file: "src/data/contact.json"
        label: "Contact-pagina"
        name: "contact"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Subtitel", name: "subtitle", widget: "text" }
          - label: "Formulier"
            name: "form"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Notitie onder knop", name: "note", widget: "string" }
